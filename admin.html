<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#073F30">
<title>Wapsi admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;800&family=Nunito+Sans:wght@400;600;700&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap">
<style>
:root{
  --bg:#F3F7F5;--card:#FFFFFF;--ink:#0E2A23;--mut:#5B716A;--line:#DDE7E2;--soft:#E8F1EC;
  --pri:#0B5D45;--onpri:#FFFFFF;--hero:#073F30;
  --found:#12855F;--miss:#D8503F;--lantern:#FFC145;--lantern-d:#B87F00;--onlantern:#3A2A00;--warn:#B3261E;
  --sh:0 10px 28px rgba(7,63,48,.13);
  --fb:"Nunito Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --fh:"Sora","Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --lh:1.5;--lhh:1.2;--fs:16px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[lang="ur"]{
  --fb:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq","Noto Naskh Arabic","Segoe UI",Tahoma,serif;
  --fh:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq","Noto Naskh Arabic","Segoe UI",Tahoma,serif;
  --lh:2.05;--lhh:1.9;--fs:15px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1512;--card:#11201B;--ink:#E6F1EC;--mut:#92AAA2;--line:#223832;--soft:#182B25;
    --pri:#34C795;--onpri:#04241B;--hero:#0B3A2E;--found:#34C795;--miss:#FF7A66;--lantern-d:#FFC145;--warn:#FF8A80;
    --sh:0 10px 28px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#0A1512;--card:#11201B;--ink:#E6F1EC;--mut:#92AAA2;--line:#223832;--soft:#182B25;
  --pri:#34C795;--onpri:#04241B;--hero:#0B3A2E;--found:#34C795;--miss:#FF7A66;--lantern-d:#FFC145;--warn:#FF8A80;
  --sh:0 10px 28px rgba(0,0,0,.45);
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);background:var(--bg)}
html.is-choose{background:var(--hero)}
*{box-sizing:border-box}
:root[lang="ur"] *{letter-spacing:0!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:var(--fs);line-height:var(--lh);-webkit-font-smoothing:antialiased}
html.is-choose body{background:var(--hero)}
h1,h2,h3,p,ol{margin:0}
h1,h2,h3{font-family:var(--fh);line-height:var(--lhh)}
button{font-family:inherit}
.i{flex:none;display:block}
[dir="rtl"] .flip{transform:scaleX(-1)}

/* ---------- top bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--bg);color:var(--ink);transition:background .2s}
.bar.on-hero{background:var(--hero);color:#fff}
.bar-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:8px;padding:8px 12px}
.ib{width:44px;height:44px;border-radius:14px;border:0;background:transparent;color:inherit;display:grid;place-items:center;cursor:pointer}
.ib:hover{background:rgba(127,127,127,.14)}
.ib[hidden]{display:block;visibility:hidden}
.bar-t{font:700 17px var(--fh);line-height:var(--lhh);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
:root[lang="ur"] .bar-t{font-weight:600;font-size:16px}
.lb{display:flex;align-items:center;gap:6px;border:1px solid currentColor;background:transparent;color:inherit;border-radius:999px;padding:3px 12px;font:600 13.5px var(--fb);line-height:var(--lh);cursor:pointer;opacity:.9}
.lb:hover{background:rgba(127,127,127,.14)}
.lb[hidden]{display:none}
:focus-visible{outline:3px solid var(--lantern);outline-offset:2px}

/* ---------- layout ---------- */
.page{max-width:640px;margin:0 auto;padding:6px 16px 120px}
.pull{margin-top:-46px;position:relative;z-index:2}
.hero-sec{position:relative;overflow:hidden;background:var(--hero);color:#fff;padding:2px 0 78px;border-radius:0 0 30px 30px}
.hero-sec::before{content:"";position:absolute;left:-15%;right:-15%;bottom:0;height:110px;background:rgba(255,255,255,.07);border-radius:50% 50% 0 0/100% 100% 0 0}
.hero-in{position:relative}
.hero-in{max-width:640px;margin:0 auto;padding:0 20px}
.logo-row{display:flex;align-items:center;gap:10px;font:800 18px var(--fh);margin:4px 0 16px}
.logo{width:36px;height:36px;border-radius:11px;background:var(--lantern);color:var(--onlantern);display:grid;place-items:center}
.pill-tag{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border-radius:999px;padding:1px 12px;font-size:13px;font-weight:600;margin-bottom:12px}
.hero-in h1{font-size:clamp(26px,7vw,38px);font-weight:800;letter-spacing:-.02em}
:root[lang="ur"] .hero-in h1{font-size:clamp(22px,6vw,30px);font-weight:600}
.hero-in p{opacity:.86;margin-top:10px;max-width:34em;font-size:15.5px}
.scene{display:block;width:100%;max-width:420px;margin:10px auto -30px;height:auto}

/* ---------- home ---------- */
.ctas{display:grid;gap:12px}
@media(min-width:560px){.ctas{grid-template-columns:1fr 1fr}}
.cta{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--sh);text-align:start;width:100%;cursor:pointer;color:var(--ink);font-family:var(--fb);line-height:var(--lh)}
.cta:active{transform:scale(.99)}
.cta .ico{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;flex:none;color:#fff}
.cta.found .ico{background:var(--found)}
.cta.miss .ico{background:var(--miss)}
:root:not([data-theme="light"]) .cta.found .ico{color:#04241B}
.cta b{display:block;font:700 16.5px var(--fh);line-height:var(--lhh)}
:root[lang="ur"] .cta b{font-weight:600;font-size:16px}
.cta small{display:block;color:var(--mut);font-size:13.5px;line-height:1.45;margin-top:2px}
.cta .chev{margin-inline-start:auto;color:var(--mut)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px}
.stat b{font:800 26px var(--fh);line-height:1.1;display:block}
.stat small{color:var(--mut);font-size:13px}
.dotb{width:10px;height:10px;border-radius:50%;flex:none}
.dotb.found{background:var(--found)}.dotb.miss{background:var(--miss)}
.sec{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin:14px 0}
.sech{display:flex;align-items:center;gap:10px;font:700 16px var(--fh);margin-bottom:14px}
:root[lang="ur"] .sech{font-weight:600}
.sech .ib2{width:32px;height:32px;border-radius:10px;background:var(--soft);color:var(--pri);display:grid;place-items:center;flex:none}
.how{list-style:none;padding:0;display:grid;gap:0}
.how li{position:relative;display:flex;gap:14px;padding-bottom:16px}
.how li:last-child{padding-bottom:0}
.how li:not(:last-child)::before{content:"";position:absolute;inset-inline-start:15px;top:34px;bottom:2px;width:2px;background:var(--line)}
.how .n{width:32px;height:32px;border-radius:50%;background:var(--pri);color:var(--onpri);display:grid;place-items:center;font:700 14px var(--fh);flex:none}
.how b{display:block;font-weight:700;line-height:var(--lhh)}
.how p{color:var(--mut);font-size:14.5px;line-height:1.5;margin-top:2px}
.help{border:1px solid color-mix(in srgb,var(--miss) 35%,var(--line));background:color-mix(in srgb,var(--miss) 7%,var(--card));border-radius:20px;padding:16px;margin:14px 0}
.help-t{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.help-t svg{color:var(--miss);margin-top:3px}
.help-t b{display:block;font:700 16px var(--fh);line-height:var(--lhh)}
.help-t span{color:var(--mut);font-size:14px}
.help-a{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.call{display:flex;align-items:center;gap:8px;text-decoration:none;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:8px 12px;font-weight:700;font-size:15px;line-height:1.3}
.call svg{color:var(--miss)}
.call small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.linkbtn{background:none;border:0;color:var(--mut);text-decoration:underline;cursor:pointer;font:600 14px var(--fb);padding:6px 0}

/* ---------- chooser ---------- */
.choose{max-width:520px;margin:0 auto;padding:44px 22px 40px;color:#fff;min-height:calc(100dvh - 20px)}
.choose .logo{width:54px;height:54px;border-radius:16px;margin-bottom:22px}
.choose h1{font-size:28px;font-weight:800}
.choose .ur{font-family:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq","Noto Naskh Arabic",Tahoma,serif;direction:rtl;font-weight:600;font-size:26px;line-height:2;letter-spacing:0}
.choose p{opacity:.8;margin-top:6px}
.langs{display:grid;gap:12px;margin-top:28px}
.lang-card{display:flex;align-items:center;gap:14px;border:0;border-radius:20px;background:#fff;color:#0E2A23;padding:18px;cursor:pointer;text-align:start;width:100%;box-shadow:0 12px 30px rgba(0,0,0,.25)}
.lang-card .lt{font:800 24px "Sora","Segoe UI",sans-serif;line-height:1.3}
.lang-card .lt.ur{font:600 24px "Noto Nastaliq Urdu","Jameel Noori Nastaleeq","Noto Naskh Arabic",Tahoma,serif;line-height:2;direction:rtl}
.lang-card small{display:block;color:#5B716A;font-size:14px}
.lang-card .ur2{font-family:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq","Noto Naskh Arabic",Tahoma,serif;direction:rtl;line-height:2}
.lang-card .go{margin-inline-start:auto;color:#0B5D45}
.lang-card:first-child{background:var(--lantern)}

/* ---------- forms ---------- */
.lead{color:var(--mut);margin:4px 0 10px;font-size:15px}
.drop{position:relative;display:grid;place-items:center;align-content:center;gap:8px;border:2px dashed var(--line);border-radius:18px;min-height:170px;background:var(--bg);color:var(--mut);text-align:center;cursor:pointer;overflow:hidden;padding:16px}
.drop:hover{border-color:var(--pri)}
.drop:focus-within{outline:3px solid var(--lantern);outline-offset:2px}
.drop .ci{width:52px;height:52px;border-radius:50%;background:var(--soft);color:var(--pri);display:grid;place-items:center}
.drop b{color:var(--ink);font-weight:700}
.drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.drop input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.drop .chg{position:absolute;inset-inline-end:10px;bottom:10px;background:rgba(0,0,0,.6);color:#fff;border-radius:999px;padding:0 12px;font-size:13px;display:flex;gap:6px;align-items:center}
label.lbl{display:block;font-weight:700;margin:14px 0 6px;font-size:14.5px}
label.lbl:first-child,.sech+label.lbl{margin-top:0}
.hint{color:var(--mut);font-size:13.5px;margin-top:6px}
input[type=text],input[type=number],input[type=tel],textarea{width:100%;font:inherit;line-height:1.7;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:9px 13px}
input:focus,textarea:focus{border-color:var(--pri);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 22%,transparent)}
textarea{min-height:84px;resize:vertical}
:root[lang="ur"] input[type=tel],:root[lang="ur"] input[type=number]{direction:ltr;text-align:right}
.row2{display:grid;gap:12px}
@media(min-width:520px){.row2{grid-template-columns:1fr 1fr}}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;color:var(--mut);border-radius:9px;padding:4px 6px;font:600 14px var(--fb);line-height:var(--lh);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--pri);color:var(--onpri)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 15.5px var(--fb);line-height:var(--lh);border:0;border-radius:14px;padding:8px 18px;cursor:pointer;background:var(--pri);color:var(--onpri);text-decoration:none}
.btn.sec{background:var(--soft);color:var(--ink)}
.btn.lantern{background:var(--lantern);color:var(--onlantern)}
.btn.big{width:100%;padding:11px 18px;font-size:16.5px;margin-top:6px}
.btn.small{padding:3px 14px;font-size:14px;border-radius:12px}
.btn.danger{background:transparent;color:var(--warn);border:1.5px solid var(--warn)}
.btn:disabled{opacity:.6;cursor:default}
.gps{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
.gps small{color:var(--mut)}

/* ---------- results / cards ---------- */
.sumbar{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:8px 0 12px}
.sumbar .ck{width:48px;height:48px;border-radius:50%;background:var(--found);color:#fff;display:grid;place-items:center;flex:none}
:root:not([data-theme="light"]) .sumbar .ck{color:#04241B}
.sumbar b{display:block;font:700 17px var(--fh);line-height:var(--lhh)}
.sumbar span{color:var(--mut);font-size:14px}
.notice{display:flex;gap:10px;background:var(--soft);border-radius:14px;padding:12px 14px;font-size:14.5px;margin:12px 0;line-height:1.55}
.notice svg{color:var(--pri);margin-top:3px}
.rc{position:relative;display:grid;grid-template-columns:104px 1fr;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin:12px 0;overflow:hidden}
.rc::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:5px;background:var(--found)}
.rc.is-miss::before{background:var(--miss)}
.rc-photo{width:104px}
.zoom{padding:0;border:0;background:none;cursor:zoom-in;display:block;width:100%}
.rc-photo img{width:104px;height:136px;object-fit:cover;border-radius:14px;display:block;background:var(--soft)}
.nophoto{width:104px;height:136px;border-radius:14px;background:var(--soft);color:var(--mut);display:grid;place-items:center}
.rc-main{min-width:0}
.rc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:0 10px;border-radius:999px;background:color-mix(in srgb,var(--found) 14%,transparent);color:var(--found)}
.is-miss .badge{background:color-mix(in srgb,var(--miss) 14%,transparent);color:var(--miss)}
.badge i{width:7px;height:7px;border-radius:50%;background:currentColor}
.rc h3{font-size:18px;margin:4px 0 2px;overflow-wrap:anywhere}
:root[lang="ur"] .rc h3{font-weight:600;font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}
.chip{background:var(--soft);border-radius:999px;padding:0 10px;font-size:13px}
.ln{font-size:14.5px;margin:3px 0;overflow-wrap:anywhere}
.ln b{font-weight:700}
.meta{font-size:12.5px;color:var(--mut)}
.ring{position:relative;width:56px;height:56px;flex:none}
.ring svg{width:56px;height:56px;display:block}
.ring .bg{fill:none;stroke:var(--soft);stroke-width:5}
.ring .fg{fill:none;stroke-width:5;stroke-linecap:round}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font:800 11px var(--fh)}
.strength{font-size:12.5px;font-weight:700;margin-top:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.contact{margin-top:10px;background:var(--soft);border-radius:14px;padding:10px 12px;font-size:15px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.contact a{color:var(--ink);font-weight:700;text-decoration:none;display:inline-flex;gap:6px;align-items:center}
.contact .who{color:var(--mut);width:100%;font-size:13px}
.seglist{display:flex;gap:8px;margin:6px 0 4px;flex-wrap:wrap}
.seglist button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:1px 14px;font:600 14px var(--fb);line-height:var(--lh);cursor:pointer}
.seglist button[aria-pressed="true"]{background:var(--pri);border-color:var(--pri);color:var(--onpri)}
.empty{text-align:center;color:var(--mut);padding:34px 14px}
.empty .eic{width:64px;height:64px;border-radius:50%;background:var(--soft);color:var(--pri);display:grid;place-items:center;margin:0 auto 12px}
.skel{border-radius:20px;height:166px;margin:12px 0;background:linear-gradient(90deg,var(--soft) 25%,var(--card) 50%,var(--soft) 75%);background-size:200% 100%;animation:sh 1.3s infinite linear}
@keyframes sh{to{background-position:-200% 0}}
.alert{display:flex;gap:10px;background:color-mix(in srgb,var(--warn) 10%,var(--card));border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));border-radius:14px;padding:12px 14px;margin:12px 0;font-size:14.5px}
.alert svg{color:var(--warn);margin-top:3px}
.setup{max-width:520px;margin:30px auto;padding:0 20px}
.setup code{background:var(--soft);padding:0 6px;border-radius:6px;font-size:14px}

/* ---------- tabs, toast, lightbox ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs[hidden]{display:none}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tab{display:flex;flex-direction:column;align-items:center;gap:1px;border:0;background:none;color:var(--mut);font:600 12px var(--fb);line-height:1.6;padding:2px;cursor:pointer}
.tab .pill{display:grid;place-items:center;width:54px;height:30px;border-radius:999px;transition:background .2s}
.tab[aria-current="true"]{color:var(--pri)}
.tab[aria-current="true"] .pill{background:var(--soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:14px;max-width:90vw;font-size:14.5px;box-shadow:var(--sh);z-index:40}
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.88);display:grid;place-items:center;padding:16px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:82vh;border-radius:14px}
.lightbox button{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));inset-inline-end:12px;background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:50%;width:44px;height:44px;display:grid;place-items:center;cursor:pointer}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}

.drop.has>.ci,.drop.has>b,.drop.has>.hint{display:none}
.drop.has{border-style:solid;border-color:var(--pri)}

.sheet-back{position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:24px 24px 0 0;padding:20px 16px calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:4px}
.sheet h3{font-size:17px;margin-bottom:6px}
.sheet .btn{width:100%}

.adm-top{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:760px;margin:0 auto;padding:14px 16px 4px}
.adm-top h1{font-size:20px}
.adm{max-width:760px;margin:0 auto;padding:6px 16px 60px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:10px 0}
@media(min-width:600px){.kpis{grid-template-columns:repeat(3,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.kpi b{display:block;font:800 26px var(--fh);line-height:1.15}
.kpi small{color:var(--mut);font-size:13px}
.kpi.bad b{color:var(--miss)}
.tabsm{display:flex;gap:8px;overflow-x:auto;padding:6px 0 10px;margin:0 -2px}
.tabsm button{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:1px 14px;font:600 14px var(--fb);line-height:1.6;cursor:pointer}
.tabsm button[aria-pressed="true"]{background:var(--pri);border-color:var(--pri);color:var(--onpri)}
.tabsm .n{display:inline-block;min-width:20px;text-align:center;margin-inline-start:6px;background:var(--soft);color:var(--ink);border-radius:999px;font-size:12px;padding:0 6px}
.tabsm button[aria-pressed="true"] .n{background:rgba(255,255,255,.25);color:inherit}
.tabsm .n.alert{background:var(--miss);color:#fff}
.wrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14.5px}
.wrow:first-of-type{border-top:0}
.wrow code{background:var(--soft);padding:0 6px;border-radius:6px}
.note{color:var(--mut);font-size:13.5px;margin:4px 0 10px}
.tag2{display:inline-block;border-radius:999px;padding:0 9px;font-size:12px;font-weight:700;background:var(--soft);margin-inline-end:6px}
.tag2.red{background:color-mix(in srgb,var(--miss) 16%,transparent);color:var(--miss)}
.tag2.grn{background:color-mix(in srgb,var(--found) 16%,transparent);color:var(--found)}
.rc.done{opacity:.85}
.rc.done::before{background:var(--mut)}
.login{max-width:420px;margin:60px auto;padding:0 16px}
.err{color:var(--warn);font-size:14px;margin-top:10px}

</style>
</head>
<body>
<main id="app"></main>
<div id="toast" class="toast" hidden style="bottom:calc(24px + env(safe-area-inset-bottom,0px))"></div>
<script type="module">
/* ================= Wapsi admin ================= */
var B='https://www.gstatic.com/firebasejs/10.12.2/';
var F={},A={},db=null,auth=null,me=null,cfg=null;
var R=[],FL=[],EV=[],tab='overview',shown={},armed=null,started=false,loadedR=false;
var $=function(id){return document.getElementById(id)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})};
var app=$('app'),DAY=86400000;
function str(x,n){return typeof x==='string'?x.slice(0,n):''}
var PHOTO_RE=/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/;
var toastT;function toast(m){var el=$('toast');el.textContent=m;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){el.hidden=true},3500)}
function ms(x){return (x&&x.toMillis)?x.toMillis():(+x||0)}
function ago(ts){var d=Date.now()-ts;if(d<0)d=0;var m=Math.floor(d/60000);if(m<1)return 'just now';if(m<60)return m+'m ago';var h=Math.floor(m/60);if(h<48)return h+'h ago';return Math.floor(h/24)+'d ago'}
var IC={
 check:'<path d="M5 13l4 4L19 7"/>',trash:'<path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/>',
 phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/>',
 chat:'<path d="M4 5h16v11H9l-5 4V5z"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/>',
 flag:'<path d="M5 21V4"/><path d="M5 4h12l-2 4 2 4H5"/>',out:'<path d="M9 21H5V3h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/>',
 shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/>'
};
function ic(n,s){s=s||16;return '<svg class="i" width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+IC[n]+'</svg>'}
function shortId(u){return str(u,6)||'?'}

/* ---------- data ---------- */
function cleanReport(d){
  var x=d.data(),age=parseInt(x.age,10);
  return{id:d.id,type:x.type==='found'?'found':'missing',name:str(x.name,100),gender:(x.gender==='m'||x.gender==='f')?x.gender:'',age:(age>0&&age<120)?age:null,
    dress:str(x.dress,300),area:str(x.area,200),details:str(x.details,1000),
    photo:(typeof x.photo==='string'&&x.photo.length<300000&&PHOTO_RE.test(x.photo))?x.photo:null,
    ts:ms(x.ts)||Date.now(),owner:str(x.ownerUid,80),status:x.status==='reunited'?'reunited':'active',via:str(x.via,10),resolvedAt:ms(x.resolvedAt)};
}
function derive(){
  var d={flagsBy:{},viewsBy:{},viewers:{},posters:{}};
  FL.forEach(function(f){(d.flagsBy[f.reportId]=d.flagsBy[f.reportId]||[]).push(f)});
  var now=Date.now();
  EV.forEach(function(e){d.viewsBy[e.reportId]=(d.viewsBy[e.reportId]||0)+1;if(now-e.ts<DAY)d.viewers[e.uid]=(d.viewers[e.uid]||0)+1});
  R.forEach(function(r){if(now-r.ts<7*DAY&&r.owner)d.posters[r.owner]=(d.posters[r.owner]||0)+1});
  return d;
}
function startWatch(){
  if(started)return;started=true;
  var er=function(){toast('Could not load data. Check your rules and connection.')};
  F.onSnapshot(F.query(F.collection(db,'reports'),F.orderBy('ts','desc'),F.limit(300)),function(s){R=s.docs.map(cleanReport);loadedR=true;render()},er);
  F.onSnapshot(F.query(F.collection(db,'flags'),F.orderBy('ts','desc'),F.limit(300)),function(s){FL=s.docs.map(function(d){var x=d.data();return{id:d.id,reportId:str(x.reportId,80),uid:str(x.uid,80),reason:str(x.reason,12),ts:ms(x.ts)}});render()},er);
  F.onSnapshot(F.query(F.collection(db,'events'),F.orderBy('ts','desc'),F.limit(500)),function(s){EV=s.docs.map(function(d){var x=d.data();return{reportId:str(x.reportId,80),uid:str(x.uid,80),ts:ms(x.ts)}});render()},er);
}

/* ---------- auth ---------- */
function showMsg(t,m){app.innerHTML='<div class="login"><div class="sec"><div class="sech">'+esc(t)+'</div><p class="note">'+m+'</p></div></div>'}
function showLogin(err,prefill){
  app.innerHTML='<div class="login"><div class="sec"><h1 class="sech" style="font-size:20px">'+ic('shield',22)+'&nbsp;Wapsi admin</h1>'+
   '<label class="lbl" for="em">Email</label><input id="em" type="text" autocomplete="username" inputmode="email" value="'+esc(prefill||'')+'">'+
   '<label class="lbl" for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" style="width:100%;font:inherit;line-height:1.7;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:9px 13px">'+
   '<button class="btn big" id="go">Sign in</button>'+(err?'<p class="err">'+esc(err)+'</p>':'')+'</div></div>';
  var go=function(){
    var e=$('em').value.trim(),p=$('pw').value;if(!e||!p)return;
    $('go').disabled=true;
    A.signInWithEmailAndPassword(auth,e,p).catch(function(){showLogin('Wrong email or password.',e)});
  };
  $('go').onclick=go;$('pw').onkeydown=function(ev){if(ev.key==='Enter')go()};
}
function bootAdmin(){
  showMsg('Loading...','');
  import('./firebase-config.js').then(function(m){
    cfg=m.firebaseConfig;
    return Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
  }).then(function(x){
    A=x[1];F=x[2];
    var app_=x[0].initializeApp(cfg,'admin');auth=A.getAuth(app_);db=F.getFirestore(app_);
    A.onAuthStateChanged(auth,function(u){
      if(!u){me=null;showLogin();return}
      F.getDoc(F.doc(db,'admins',u.uid)).then(function(s){
        if(s.exists()){me=u;startWatch();render()}
        else{A.signOut(auth);showLogin('This account is not an admin.')}
      }).catch(function(){A.signOut(auth);showLogin('Could not verify admin access. Check the rules.')});
    });
  }).catch(function(){showMsg('Could not load','Firebase did not load. Check your internet connection and firebase-config.js.')});
}

/* ---------- actions ---------- */
function confirmBtn(id,label,cls,icon){
  return '<button class="btn small '+cls+'" data-act="'+esc(id.split(':')[0])+'" data-id="'+esc(id.split(':')[1])+'">'+ic(icon)+(armed===id?'Tap again to confirm':label)+'</button>';
}
function safe(p,ok){return Promise.resolve(p).then(function(){toast(ok)}).catch(function(){toast('That did not work. Check the rules.')})}
function delContact(id){return F.deleteDoc(F.doc(db,'contacts',id)).catch(function(){})}
function delFlags(id){return Promise.all(FL.filter(function(f){return f.reportId===id}).map(function(f){return F.deleteDoc(F.doc(db,'flags',f.id))}))}
function act(name,id){
  var key=name+':'+id;
  if(name==='contact'){
    F.getDoc(F.doc(db,'contacts',id)).then(function(s){shown[id]=s.exists()?{n:str(s.data().contactName,60),p:str(s.data().contact,30)}:{none:true};render()}).catch(function(){toast('Could not load the contact.')});return;
  }
  if(name==='dismiss'){safe(delFlags(id),'Complaints cleared.');return}
  if(armed!==key){armed=key;render();return}
  armed=null;
  if(name==='reunite'){
    safe(F.updateDoc(F.doc(db,'reports',id),{status:'reunited',via:'admin',resolvedAt:F.serverTimestamp(),photo:null}).then(function(){return delContact(id)}),'Marked as reunited.');
  }else if(name==='delete'){
    safe(F.deleteDoc(F.doc(db,'reports',id)).then(function(){return delContact(id)}).then(function(){return delFlags(id)}),'Report deleted.');
  }else if(name==='purge'){
    var mine=R.filter(function(r){return r.owner===id});
    safe(Promise.all(mine.map(function(r){return F.deleteDoc(F.doc(db,'reports',r.id)).then(function(){return delContact(r.id)})})),mine.length+' reports deleted.');
  }
}

/* ---------- views ---------- */
function reportCard(r,d,mode){
  var fl=d.flagsBy[r.id]||[],views=d.viewsBy[r.id]||0,done=r.status==='reunited',sh=shown[r.id];
  var reasons={};fl.forEach(function(f){reasons[f.reason]=(reasons[f.reason]||0)+1});
  var rs=Object.keys(reasons).map(function(k){return '<span class="tag2 red">'+esc(k)+' ×'+reasons[k]+'</span>'}).join('');
  var contact='';
  if(sh){
    if(sh.none)contact='<div class="contact">No contact saved.</div>';
    else{var dg=sh.p.replace(/\D/g,''),wa=dg.replace(/^0/,'92');
      contact='<div class="contact"><span class="who">'+esc(sh.n||'Contact')+'</span><a href="tel:'+esc(sh.p.replace(/[^\d+]/g,''))+'" dir="ltr">'+ic('phone')+esc(sh.p)+'</a>'+(wa.length>=10?'<a href="https://wa.me/'+wa+'" target="_blank" rel="noopener noreferrer">'+ic('chat')+'WhatsApp</a>':'')+'</div>'}
  }
  return '<article class="rc '+(r.type==='found'?'is-found':'is-miss')+(done?' done':'')+'">'+
   '<div class="rc-photo">'+(r.photo?'<img alt="" src="'+r.photo+'" style="width:104px;height:136px;object-fit:cover;border-radius:14px;display:block">':'<div class="nophoto">'+ic('user',38)+'</div>')+'</div>'+
   '<div class="rc-main"><div><span class="badge"><i></i>'+(r.type==='found'?'Found person':'Missing person')+'</span></div>'+
    '<h3>'+esc(r.name||'Name unknown')+'</h3>'+
    '<div class="chips">'+(r.gender?'<span class="chip">'+(r.gender==='m'?'Male':'Female')+'</span>':'')+(r.age?'<span class="chip">Age '+r.age+'</span>':'')+'</div>'+
    (r.area?'<p class="ln"><b>Place:</b> '+esc(r.area)+'</p>':'')+
    (r.dress?'<p class="ln"><b>Clothes:</b> '+esc(r.dress)+'</p>':'')+
    '<p class="meta">'+ago(r.ts)+' · owner <code>'+esc(shortId(r.owner))+'</code>'+(views?' · '+views+' contact views':'')+'</p>'+
    (done?'<p class="ln"><span class="tag2 grn">Reunited'+(r.via==='wapsi'?' via Wapsi':r.via==='admin'?' (admin)':' (other way)')+'</span>'+(r.resolvedAt?ago(r.resolvedAt):'')+'</p>':'')+
    (rs?'<p class="ln">'+rs+'</p>':'')+
   '</div><div style="grid-column:1/-1">'+contact+'<div class="actions">'+
    (!done?'<button class="btn small" data-act="contact" data-id="'+esc(r.id)+'">'+ic('phone')+'Show contact</button>':'')+
    (!done?confirmBtn('reunite:'+r.id,'Mark reunited','sec','check'):'')+
    (fl.length?'<button class="btn small sec" data-act="dismiss" data-id="'+esc(r.id)+'">'+ic('flag')+'Dismiss complaints</button>':'')+
    confirmBtn('delete:'+r.id,'Delete','danger','trash')+
   '</div></div></article>';
}
function list(items,d,empty){return items.length?items.map(function(r){return reportCard(r,d,'')}).join(''):'<p class="note" style="text-align:center;padding:26px 0">'+empty+'</p>'}
function render(){
  if(!me)return;
  var d=derive(),now=Date.now();
  var active=R.filter(function(r){return r.status!=='reunited'}),done=R.filter(function(r){return r.status==='reunited'});
  var flagged=R.filter(function(r){return (d.flagsBy[r.id]||[]).length}).sort(function(a,b){return d.flagsBy[b.id].length-d.flagsBy[a.id].length});
  var follow=active.filter(function(r){var age=now-r.ts,v=d.viewsBy[r.id]||0;return age>7*DAY||(v>0&&age>DAY)}).sort(function(a,b){return (d.viewsBy[b.id]||0)-(d.viewsBy[a.id]||0)||a.ts-b.ts});
  var tabs=[['overview','Overview',0],['flagged','Flagged',flagged.length,1],['follow','Follow-up',follow.length],['reunited','Reunited',done.length],['all','All',R.length]];
  var head='<div class="adm-top"><h1>Wapsi admin</h1><button class="btn small sec" id="out">'+ic('out')+'Sign out</button></div><div class="adm">'+
   '<div class="tabsm">'+tabs.map(function(t){return '<button data-tab="'+t[0]+'" aria-pressed="'+(tab===t[0])+'">'+t[1]+(t[2]?'<span class="n'+(t[3]?' alert':'')+'">'+t[2]+'</span>':'')+'</button>'}).join('')+'</div>';
  var body='';
  if(!loadedR)body='<p class="note">Loading...</p>';
  else if(tab==='overview'){
    var f=active.filter(function(r){return r.type==='found'}).length,m=active.length-f;
    var viaW=done.filter(function(r){return r.via==='wapsi'}).length,viaO=done.length-viaW;
    var new24=R.filter(function(r){return now-r.ts<DAY}).length,cv24=EV.filter(function(e){return now-e.ts<DAY}).length;
    var badViewers=Object.keys(d.viewers).filter(function(u){return d.viewers[u]>=15}).sort(function(a,b){return d.viewers[b]-d.viewers[a]});
    var heavy=Object.keys(d.posters).filter(function(u){return d.posters[u]>=5}).sort(function(a,b){return d.posters[b]-d.posters[a]});
    body='<div class="kpis">'+
     '<div class="kpi"><b>'+active.length+'</b><small>Open cases ('+f+' found, '+m+' missing)</small></div>'+
     '<div class="kpi"><b>'+viaW+'</b><small>Reunited via Wapsi</small></div>'+
     '<div class="kpi"><b>'+viaO+'</b><small>Closed (other / admin)</small></div>'+
     '<div class="kpi'+(flagged.length?' bad':'')+'"><b>'+flagged.length+'</b><small>Reports with complaints</small></div>'+
     '<div class="kpi"><b>'+new24+'</b><small>New reports, last 24h</small></div>'+
     '<div class="kpi"><b>'+cv24+'</b><small>Contact views, last 24h</small></div></div>'+
     '<section class="sec"><h2 class="sech">'+ic('shield',18)+'&nbsp;Security watch</h2>'+
     '<p class="note">User IDs are anonymous and can be recreated, so you cannot block a person. You can delete what they posted and watch for patterns.</p>'+
     (badViewers.length?badViewers.map(function(u){return '<div class="wrow"><span><span class="tag2 red">Possible scraping</span>user <code>'+esc(shortId(u))+'</code> opened '+d.viewers[u]+' phone numbers in 24h</span></div>'}).join(''):'<div class="wrow"><span>No unusual contact viewing in the last 24h.</span></div>')+
     (heavy.length?heavy.map(function(u){return '<div class="wrow"><span><span class="tag2 red">Heavy poster</span>user <code>'+esc(shortId(u))+'</code> posted '+d.posters[u]+' reports in 7 days</span>'+confirmBtn('purge:'+u,'Delete all','danger','trash')+'</div>'}).join(''):'<div class="wrow"><span>No user is posting unusually many reports.</span></div>')+
     (flagged.length?'<div class="wrow"><span><span class="tag2 red">'+flagged.length+' reports</span>have complaints. Open the Flagged tab.</span></div>':'')+
     '</section>'+
     '<section class="sec"><h2 class="sech">Follow-up</h2><p class="note">'+follow.length+' open cases are older than 7 days or had their contact opened. Ask the owner if the person was found, then close the case.</p></section>';
  }
  else if(tab==='flagged')body='<p class="note">Reports that users complained about, most complaints first.</p>'+list(flagged,d,'No complaints. Nice.');
  else if(tab==='follow')body='<p class="note">Open cases that are over 7 days old, or whose contact was opened. Use “Show contact” to call or WhatsApp the owner, then close the case if the person was found.</p>'+list(follow,d,'Nothing needs follow-up.');
  else if(tab==='reunited')body=list(done.sort(function(a,b){return (b.resolvedAt||b.ts)-(a.resolvedAt||a.ts)}),d,'No closed cases yet.');
  else body=list(R,d,'No reports yet.');
  app.innerHTML=head+body+'</div>';
  $('out').onclick=function(){A.signOut(auth).then(function(){me=null;started=false;showLogin()})};
  Array.prototype.forEach.call(app.querySelectorAll('[data-tab]'),function(b){b.onclick=function(){tab=b.getAttribute('data-tab');armed=null;render()}});
  Array.prototype.forEach.call(app.querySelectorAll('[data-act]'),function(b){b.onclick=function(){act(b.getAttribute('data-act'),b.getAttribute('data-id'))}});
}
bootAdmin();

</script>
</body>
</html>
